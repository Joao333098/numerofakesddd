<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Kaeli System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>@</text></svg>">
</head>
<body>
    <canvas id="particles-canvas"></canvas>

    <nav class="navbar">
        <a href="/" class="logo"><i class="fas fa-bolt"></i> KAELI<span>SYSTEM</span></a>
        <button class="hamburger"><span></span><span></span><span></span></button>
        <ul class="nav-links">
            <li><a href="/"><i class="fas fa-home"></i> Início</a></li>
            <li><a href="/login"><i class="fas fa-sign-in-alt"></i> Entrar</a></li>
            <li><a href="/cadastro" class="nav-btn nav-btn-primary"><i class="fas fa-user-plus"></i> Cadastrar</a></li>
        </ul>
    </nav>

    <div class="auth-page">
        <div class="auth-container">
            <h1 class="auth-title">Criar Conta</h1>
            <p class="auth-subtitle">Crie sua conta e comece a comprar</p>
            <div class="error-msg" id="errorMsg"></div>
            <form id="registerForm">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Usuário</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-user"></i></span>
                        <input type="text" name="username" placeholder="Escolha um nome de usuário" required autocomplete="username">
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-envelope"></i></span>
                        <input type="email" name="email" placeholder="seu@email.com" required autocomplete="email">
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-key"></i> Senha</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fas fa-key"></i></span>
                        <input type="password" name="password" placeholder="Crie uma senha forte (mín. 6 caracteres)" required minlength="6" autocomplete="new-password">
                    </div>
                </div>
                <button type="submit" class="btn-submit"><i class="fas fa-bolt"></i> Criar Conta</button>
            </form>
            <div class="auth-footer">
                Já tem conta? <a href="/login">Faça login</a>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 <a href="/">Kaeli System</a> - Todos os direitos reservados <i class="fas fa-bolt"></i></p>
    </footer>

    <script src="/js/script.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const btn = form.querySelector('.btn-submit');
            const errorMsg = document.getElementById('errorMsg');
            const data = Object.fromEntries(new FormData(form));

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Criando...';
            btn.disabled = true;
            errorMsg.style.display = 'none';

            try {
                const res = await fetchAPI('/api/register', {
                    method: 'POST',
                    body: JSON.stringify(data),
                });
                if (res.success) window.location.href = '/dashboard';
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.display = 'block';
            } finally {
                btn.innerHTML = '<i class="fas fa-bolt"></i> Criar Conta';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
